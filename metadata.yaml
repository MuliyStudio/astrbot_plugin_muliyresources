desc: |
  「找资源 + 追更新」：影视、游戏、软件、短剧、小说五大类多源聚合搜索与下载。
  · 影视双源自动切换（片库新站账号自动登录 / a123tv 免登录），支持在线播放与多网盘下载；游戏走 xdgame / switch618 双源；短剧直达夸克网盘；小说基于 so-novel 多源聚合，支持 txt / epub / html / pdf 整本发送。
  · 软件 / 游戏 / 影视 / 短剧 四套独立定时日报，自动渲染成图片以文件形式推送到指定群。
  · 附带网易云语音名片（链接/小程序一键转语音，VIP 歌曲需会员 Cookie）、爱奇艺/腾讯/优酷/芒果 VIP 视频解析、摸头杀 / 给你一脚 / 给我按摩等表情包娱乐。
  · QQ 入群审核：新成员需在限时内回复图形验证码（20-100 加减法），超时或答错自动移出群聊。
  · 支持 LLM 自然语言（「帮我找原神」「想看流浪地球」）与命令式两种玩法，无需记命令。
